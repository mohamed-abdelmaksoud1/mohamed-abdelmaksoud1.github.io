nav a:hover,nav a.on{background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff}

main{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:0 20px}

h1{font-size:clamp(2.2rem,10vw,4.2rem);line-height:1.25;margin:6px 0;background:linear-gradient(120deg,var(--a1),var(--a2),var(--a3),var(--a1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .8s .15s both,shine 6s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.typing{font-size:1.2rem;min-height:2em;color:var(--muted);animation:up .8s .3s both}
.typing::after{content:"|";margin-inline-start:2px;color:var(--a2);animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:28px;animation:up .8s .5s both}
.btn{padding:11px 24px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--text);text-decoration:none;transition:.25s}
.btn.main{background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(99,102,241,.35)}
.scroll{margin-top:44px;color:var(--muted);animation:bounce 2s infinite}
@keyframes bounce{50%{transform:translateY(8px)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
section{padding:56px 0}
h2{font-size:1.6rem;margin-bottom:20px}
h2::after{content:"";display:block;width:54px;height:4px;border-radius:4px;margin-top:6px;background:linear-gradient(90deg,var(--a1),var(--a2))}
.about{padding:24px;background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:16px}
.card{padding:20px;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.3s}
.card:hover{transform:translateY(-6px);border-color:var(--a2)}
.card .ic{font-size:1.8rem}
.card h3{font-size:1.05rem}
.card p{color:var(--muted);font-size:.93rem;line-height:1.7}
.info .k{color:var(--a2);font-size:.8rem}
.info .v{font-weight:700}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .7s,transform .7s}
.reveal.show{opacity:1;transform:none}
.contact-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.c-card{display:flex;align-items:center;gap:14px;padding:18px;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);text-decoration:none;transition:.3s}

footer{text-align:center;color:var(--muted);padding:30px 0 40px;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>

<script>
const T={en:["Business Information Systems","Passionate about data","Learning something new every day"],
ar:["نظم معلومات الأعمال","شغوف بالبيانات","بتعلم كل يوم حاجة جديدة"]};
const TITLE={en:"Mohamed Abdelmaksoud | Business Information Systems",ar:"محمد عبدالمقصود | نظم معلومات الأعمال"};
let lang="en";
try{const s=localStorage.getItem("lang");if(s==="ar"||s==="en")lang=s}catch(e){}
const btn=document.getElementById("lang"),el=document.getElementById("typing");
let w=0,c=0,del=false,timer;
function setLang(l){lang=l;
 document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";
 document.title=TITLE[l];btn.textContent=l==="ar"?"EN":"عربي";
 document.querySelectorAll("[data-en]").forEach(n=>{n.innerHTML=n.dataset[l]});
 w=0;c=0;del=false;clearTimeout(timer);tick();
 try{localStorage.setItem("lang",l)}catch(e){}}
function tick(){const t=T[lang][w];el.textContent=t.slice(0,c);
 if(!del&&c===t.length){del=true;timer=setTimeout(tick,1400);return}
 if(del&&c===0){del=false;w=(w+1)%T[lang].length}
 c+=del?-1:1;timer=setTimeout(tick,del?40:80)}
btn.onclick=()=>setLang(lang==="en"?"ar":"en");
document.getElementById("y").textContent=new Date().getFullYear();
setLang(lang);
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("show");io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll(".reveal").forEach(n=>io.observe(n));
const bar=document.getElementById("bar"),links=[...document.querySelectorAll("nav a")];
addEventListener("scroll",()=>{const h=document.documentElement;bar.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+"%";
 const ids=["top","about","soon","contact"];let cur=0;ids.forEach((id,i)=>{if(document.getElementById(id).getBoundingClientRect().top<innerHeight*.4)cur=i});
 links.forEach((a,i)=>a.classList.toggle("on",i===cur))},{passive:true});
const cv=document.getElementById("bg"),cx=cv.getContext("2d");let P=[],W,H;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;const n=Math.min(55,Math.floor(W*H/18000));
 P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))}
size();addEventListener("resize",size);
function draw(){cx.clearRect(0,0,W,H);const col=matchMedia("(prefers-color-scheme:light)").matches?"70,80,200":"140,160,255";
 P.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
  cx.fillStyle=`rgba(${col},.8)`;cx.beginPath();cx.arc(p.x,p.y,1.8,0,7);cx.fill();
  for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);
   if(d<120){cx.strokeStyle=`rgba(${col},${.25*(1-d/120)})`;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}});
 requestAnimationFrame(draw)}
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)draw();
</script>
